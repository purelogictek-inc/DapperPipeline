name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags: v1.0.0, v1.2.3-preview.1, etc.

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release  # Secret scoping + optional approval gate
    permissions:
      id-token: write     # Required for OIDC token (NuGet trusted publishing)
      contents: read

    # A release is verified against real databases, not just string-compared. Several broken
    # versions shipped before this existed.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: VeryStr0ngP@ssw0rd
          POSTGRES_DB: dapperpipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: VeryStr0ngP@ssw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'VeryStr0ngP@ssw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      DP_POSTGRES: "Host=localhost;Port=5432;Database=dapperpipeline;Username=postgres;Password=VeryStr0ngP@ssw0rd;Include Error Detail=true"
      DP_SQLSERVER: "Server=localhost,1433;Database=dapperpipeline;User Id=sa;Password=VeryStr0ngP@ssw0rd;TrustServerCertificate=true;Encrypt=false"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches Directory.Build.props version
        run: |
          PROJECT_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag version (${{ steps.version.outputs.VERSION }}) doesn't match Directory.Build.props version ($PROJECT_VERSION)"
            exit 1
          fi

      - name: Build and test
        run: |
          dotnet build DapperPipeline.slnx -c Release
          dotnet test DapperPipeline.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack DapperPipeline.slnx -c Release --no-build -o ./artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}  # nuget.org profile name (NOT email)

      - name: Push to NuGet
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
