name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Real databases. The integration tests were previously only runnable on a developer's machine,
    # which meant in practice they ran once — and every renderer they cover (PostgreSQL's unnest,
    # SQL Server's OPENJSON and TVPs, the statement separator, the isolation levels) had shipped
    # verified by string comparison alone. That is how a SQL Server default of Snapshot isolation
    # got released: it fails on any database without ALLOW_SNAPSHOT_ISOLATION, which is most of them.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: VeryStr0ngP@ssw0rd
          POSTGRES_DB: dapperpipeline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: VeryStr0ngP@ssw0rd
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'VeryStr0ngP@ssw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      # The tests read these; without them they fall back to a local dev setup and, failing that,
      # report as SKIPPED rather than passing vacuously.
      DP_POSTGRES: "Host=localhost;Port=5432;Database=dapperpipeline;Username=postgres;Password=VeryStr0ngP@ssw0rd;Include Error Detail=true"
      DP_SQLSERVER: "Server=localhost,1433;Database=dapperpipeline;User Id=sa;Password=VeryStr0ngP@ssw0rd;TrustServerCertificate=true;Encrypt=false"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore DapperPipeline.slnx

      - name: Build
        run: dotnet build DapperPipeline.slnx -c Release --no-restore

      - name: Test
        run: dotnet test DapperPipeline.slnx -c Release --no-build

      # A skip is how these tests report "no database". That is correct locally, but in CI — where
      # the databases are right there — a skip means the containers never came up, and the whole
      # point of this job quietly evaporates. Fail instead.
      - name: Assert the integration tests actually ran
        run: |
          dotnet test DapperPipeline.slnx -c Release --no-build \
            --filter "FullyQualifiedName~Integration.Postgres|FullyQualifiedName~Integration.SqlServer" \
            --logger "console;verbosity=normal" | tee results.txt

          if grep -qE "Skipped:\s*[1-9]" results.txt; then
            echo "::error::Integration tests were SKIPPED — the database containers did not come up."
            exit 1
          fi
          if ! grep -qE "Passed:\s*[1-9]" results.txt; then
            echo "::error::No integration tests ran at all."
            exit 1
          fi
